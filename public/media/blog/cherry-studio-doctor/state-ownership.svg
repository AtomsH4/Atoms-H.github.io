<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1168" viewBox="0 0 848 1168" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#37335f" font-weight="700">检查事实与交互状态分开管理</text>
<text x="32" y="80" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#62667f">后端拥有报告，前端管理会话，视图按事实派生</text>
<rect x="32" y="176" width="328" height="128" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="196" y="240" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="196" dy="-32.2">后端 Doctor</tspan><tspan x="196" dy="32.2">检查状态与报告</tspan><tspan x="196" dy="32.2">唯一的检查事实来源</tspan></text>
<rect x="448" y="176" width="320" height="128" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="608" y="240" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#254e68"><tspan x="608" dy="-30.8">前端 Controller</tspan><tspan x="608" dy="30.8">经 IPC 发出命令</tspan><tspan x="608" dy="30.8">run / cancel / fix</tspan></text>
<rect x="32" y="408" width="328" height="128" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="196" y="472" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#37335f"><tspan x="196" dy="-30.8">共享缓存 doctor.state</tspan><tspan x="196" dy="30.8">消费后端发布的事实</tspan><tspan x="196" dy="30.8">不在本地改写报告</tspan></text>
<rect x="448" y="408" width="320" height="128" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="608" y="472" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49"><tspan x="608" dy="-30.8">前端会话 Session</tspan><tspan x="608" dy="30.8">面板 · 草稿 · 证据授权</tspan><tspan x="608" dy="30.8">交互阶段 · 重启提示</tspan></text>
<rect x="32" y="640" width="328" height="128" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="196" y="704" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#254e68"><tspan x="196" dy="-30.8">派生 ViewModel</tspan><tspan x="196" dy="30.8">分组 · 问题数量</tspan><tspan x="196" dy="30.8">过期标记 · 可取消状态</tspan></text>
<rect x="448" y="640" width="320" height="128" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="608" y="704" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#255c49"><tspan x="608" dy="-29.4">Doctor 界面</tspan><tspan x="608" dy="29.4">展示报告与交互状态</tspan><tspan x="608" dy="29.4">用户操作交给 Controller</tspan></text>
<rect x="32" y="848" width="736" height="104" rx="8" fill="#fff3dc" stroke="#b68632" stroke-width="1.5"/>
<text x="400" y="900" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#624712"><tspan x="400" dy="-16.1">修复返回成功 ≠ 检查报告已经更新</tspan><tspan x="400" dy="32.2">操作返回可触发提示；检查结果等待后端发布。</tspan></text>
<text x="32" y="984" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">AI 诊断单独持有状态，不计入 Doctor 报告与检查统计。</text>
<text x="32" y="1048" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">实线：调用或派生关系　虚线：后端状态发布</text>
<line x1="448" y1="240" x2="360" y2="240" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="196" y1="304" x2="196" y2="408" stroke="#8170c9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="608" y1="304" x2="608" y2="408" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="196" y1="536" x2="196" y2="640" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="608" y1="536" x2="608" y2="640" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="360" y1="704" x2="448" y2="704" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<text x="402" y="216" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68">命令</text>
<text x="236" y="356" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">发布</text>
<text x="672" y="356" text-anchor="middle" dominant-baseline="central" font-family="Arial" font-size="20" fill="#255c49">dispatch</text>
<text x="236" y="588" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68">派生</text>
<text x="648" y="588" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#255c49">展示</text>
<text x="402" y="680" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68">展示</text>
</svg>