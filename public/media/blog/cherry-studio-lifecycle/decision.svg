<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1104" viewBox="0 0 816 1104" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#37335f" font-weight="700">先查资源归属，再决定服务形态</text>
<text x="32" y="80" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">依据仓库的代码、文档、调用点和测试</text>
<polygon points="204,152 376,220 204,288 32,220" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="204" y="220" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#37335f">关键事实是否明确？</text>
<rect x="440" y="160" width="288" height="120" rx="60" fill="#fff3dc" stroke="#b68632" stroke-width="1.5"/>
<text x="584" y="220" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#624712"><tspan x="584" dy="-29.4">证据不足</tspan><tspan x="584" dy="29.4">Insufficient evidence</tspan><tspan x="584" dy="29.4">先补充事实</tspan></text>
<polygon points="204,368 376,444 204,520 32,444" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="204" y="444" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="204" dy="-16.1">有跨调用资源</tspan><tspan x="204" dy="32.2">或持续性全局副作用？</tspan></text>
<rect x="440" y="384" width="288" height="120" rx="60" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="584" y="444" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68"><tspan x="584" dy="-28">无需新增 Lifecycle</tspan><tspan x="584" dy="28">Lifecycle not justified</tspan><tspan x="584" dy="28">资源完全属于单次调用</tspan></text>
<polygon points="204,600 376,676 204,752 32,676" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="204" y="676" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="204" dy="-16.1">更小的方案</tspan><tspan x="204" dy="32.2">能正确承担归属吗？</tspan></text>
<rect x="440" y="616" width="288" height="120" rx="60" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="584" y="676" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68"><tspan x="584" dy="-28">无需新增 Lifecycle</tspan><tspan x="584" dy="28">Lifecycle not justified</tspan><tspan x="584" dy="28">沿用合适的资源 owner</tspan></text>
<rect x="32" y="840" width="344" height="104" rx="52" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="204" y="892" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#255c49"><tspan x="204" dy="-16.1">需要独立生命周期归属</tspan><tspan x="204" dy="32.2">Lifecycle required</tspan></text>
<text x="448" y="832" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#62667f"><tspan x="448" dy="0">更小的方案依次比较</tspan><tspan x="448" dy="29.4">函数 → 直接导入的单例</tspan><tspan x="448" dy="29.4">→ 现有 Lifecycle owner</tspan></text>
<text x="32" y="984" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#62667f">关键事实：资源、owner、存续时间、顺序、转换、清理与恢复</text>
<line x1="376" y1="220" x2="440" y2="220" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="204" y1="288" x2="204" y2="368" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="376" y1="444" x2="440" y2="444" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="204" y1="520" x2="204" y2="600" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="376" y1="676" x2="440" y2="676" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="204" y1="752" x2="204" y2="840" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<text x="394" y="200" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">否</text>
<text x="228" y="332" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">是</text>
<text x="394" y="424" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">否</text>
<text x="228" y="560" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">是</text>
<text x="394" y="656" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">是</text>
<text x="228" y="784" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#37335f">否</text>
</svg>