<svg xmlns="http://www.w3.org/2000/svg" width="808" height="1136" viewBox="0 0 808 1136" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#37335f" font-weight="700">三种能力，三个不同的问题</text>
<text x="32" y="80" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">确认需要 Lifecycle 后，只选择真实需要的能力</text>
<text x="32" y="152" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#37335f" font-weight="700">@Conditional · 整个服务是否存在</text>
<rect x="32" y="216" width="288" height="128" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="176" y="280" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#37335f"><tspan x="176" dy="-16.8">启动时判断</tspan><tspan x="176" dy="33.6">会话内不变的条件</tspan></text>
<rect x="416" y="216" width="312" height="128" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="572" y="280" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="572" dy="-16.1">成立：纳入服务</tspan><tspan x="572" dy="32.2">不成立：排除整个服务</tspan></text>
<text x="32" y="360" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">场景：仅 macOS 可用的原生 hook；消费者处理服务缺席</text>
<text x="32" y="448" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#254e68" font-weight="700">Activatable · 资源是否持有</text>
<rect x="32" y="520" width="288" height="120" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="176" y="580" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#254e68"><tspan x="176" dy="-16.8">未激活</tspan><tspan x="176" dy="33.6">资源已释放</tspan></text>
<rect x="440" y="520" width="288" height="120" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="584" y="580" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#254e68"><tspan x="584" dy="-16.8">已激活</tspan><tspan x="584" dy="33.6">资源已获取</tspan></text>
<text x="32" y="664" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f"><tspan x="32" dy="0">可反复启停；服务实例与控制 / 状态 IPC 保持常驻</tspan><tspan x="32" dy="28">场景：用户反复开关本地发现</tspan></text>
<text x="32" y="776" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#255c49" font-weight="700">Pausable · 工作是否继续执行</text>
<rect x="32" y="848" width="288" height="120" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="176" y="908" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#255c49"><tspan x="176" dy="-16.8">正常运行</tspan><tspan x="176" dy="33.6">接收并调度任务</tspan></text>
<rect x="440" y="848" width="288" height="120" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="584" y="908" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49"><tspan x="584" dy="-15.4">暂停完成</tspan><tspan x="584" dy="30.8">停止接收且排空在途任务</tspan></text>
<text x="32" y="992" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f"><tspan x="32" dy="0">保留同一实例与资源，恢复时重新开放调度</tspan><tspan x="32" dy="28">场景：为备份快照暂停同步；图示采用该场景的排空约定</tspan></text>
<line x1="320" y1="280" x2="416" y2="280" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="320" y1="580" x2="440" y2="580" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" marker-start="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="320" y1="908" x2="440" y2="908" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" marker-start="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<text x="374" y="256" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#37335f">一次</text>
<text x="380" y="548" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#37335f">启用 / 停用</text>
<text x="380" y="876" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#37335f">暂停 / 恢复</text>
</svg>