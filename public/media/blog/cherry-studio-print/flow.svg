<svg xmlns="http://www.w3.org/2000/svg" width="848" height="1152" viewBox="0 0 848 1152" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#37335f" font-weight="700">从当前内容到打印输出</text>
<text x="32" y="80" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#62667f">页面取内容，主进程编排，隐藏窗口承载排版</text>
<rect x="32" y="168" width="336" height="120" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="200" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="200" dy="-32.2">笔记页面与编辑器</tspan><tspan x="200" dy="32.2">读取当前值</tspan><tspan x="200" dy="32.2">空内容提示并结束</tspan></text>
<rect x="456" y="168" width="312" height="120" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="612" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#37335f"><tspan x="612" dy="-30.8">类型化 IPC 请求</tspan><tspan x="612" dy="30.8">当前 title / markdown</tspan><tspan x="612" dy="30.8">可选 sourcePath</tspan></text>
<rect x="456" y="400" width="312" height="120" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="612" y="460" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#254e68"><tspan x="612" dy="-30.8">主进程 PrintService</tspan><tspan x="612" dy="30.8">生成 HTML</tspan><tspan x="612" dy="30.8">编排打印与导出</tspan></text>
<rect x="32" y="400" width="336" height="120" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="200" y="460" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#254e68"><tspan x="200" dy="-30.8">主进程 WindowManager</tspan><tspan x="200" dy="30.8">提供窗口</tspan><tspan x="200" dy="30.8">创建、查找、关闭</tspan></text>
<rect x="32" y="640" width="336" height="128" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="200" y="704" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49"><tspan x="200" dy="-30.8">隐藏 BrowserWindow</tspan><tspan x="200" dy="30.8">PrintService 加载 HTML</tspan><tspan x="200" dy="30.8">不改动可见编辑器</tspan></text>
<rect x="456" y="640" width="312" height="128" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="612" y="704" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49"><tspan x="612" dy="-30.8">执行打印 / 导出</tspan><tspan x="612" dy="30.8">打印等待回调</tspan><tspan x="612" dy="30.8">PDF 等待生成与写入</tspan></text>
<rect x="456" y="872" width="312" height="128" rx="64" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="612" y="936" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#255c49"><tspan x="612" dy="-29.4">finally 关闭窗口</tspan><tspan x="612" dy="29.4">PrintService 调用</tspan><tspan x="612" dy="29.4">WindowManager.close</tspan></text>
<text x="32" y="880" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#624712"><tspan x="32" dy="0">PDF 分支先询问保存位置</tspan><tspan x="32" dy="29.4">取消：false，不创建窗口</tspan><tspan x="32" dy="29.4">写入成功后才返回 true</tspan></text>
<text x="32" y="1032" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#62667f">准备窗口失败同样关闭；图中箭头简化展示职责交接。</text>
<line x1="368" y1="228" x2="456" y2="228" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="612" y1="288" x2="612" y2="400" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="456" y1="460" x2="368" y2="460" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="200" y1="520" x2="200" y2="640" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="368" y1="704" x2="456" y2="704" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="612" y1="768" x2="612" y2="872" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<text x="660" y="344" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68">跨进程</text>
<text x="240" y="582" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#254e68">创建</text>
<text x="660" y="820" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#255c49">结束后</text>
</svg>