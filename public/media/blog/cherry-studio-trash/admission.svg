<svg xmlns="http://www.w3.org/2000/svg" width="752" height="1104" viewBox="0 0 752 1104" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#37335f" font-weight="700">Topic 归档：检查与执行不可插队</text>
<text x="32" y="104" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#916039" font-weight="700">没有共享锁：检查结果会过期</text>
<rect x="32" y="176" width="176" height="104" rx="8" fill="#fff2df" stroke="#ba8850" stroke-width="1.5"/>
<text x="120" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#785324"><tspan x="120" dy="-15.4">归档请求</tspan><tspan x="120" dy="30.8">检查：空闲</tspan></text>
<rect x="264" y="176" width="176" height="104" rx="8" fill="#fff2df" stroke="#ba8850" stroke-width="1.5"/>
<text x="352" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#785324"><tspan x="352" dy="-15.4">另一请求</tspan><tspan x="352" dy="30.8">开始生成</tspan></text>
<rect x="496" y="176" width="176" height="104" rx="8" fill="#fff2df" stroke="#ba8850" stroke-width="1.5"/>
<text x="584" y="228" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#785324"><tspan x="584" dy="-15.4">归档发生</tspan><tspan x="584" dy="30.8">生成仍在继续</tspan></text>
<text x="32" y="336" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#255c49" font-weight="700">共享 dispatch lock：串行决定能否准入</text>
<rect x="368" y="424" width="304" height="88" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="520" y="468" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49">取得 dispatch lock</text>
<rect x="368" y="568" width="304" height="88" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="520" y="612" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49"><tspan x="520" dy="-15.4">检查未完成工作</tspan><tspan x="520" dy="30.8">忙碌则拒绝转换</tspan></text>
<rect x="368" y="712" width="304" height="88" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="520" y="756" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#254e68"><tspan x="520" dy="-15.4">同步数据库事务</tspan><tspan x="520" dy="30.8">检查来源状态并提交</tspan></text>
<rect x="368" y="856" width="304" height="88" rx="44" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="520" y="900" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#255c49">释放 dispatch lock</text>
<rect x="32" y="568" width="280" height="232" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="172" y="684" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#37335f"><tspan x="172" dy="-58.8">新生成请求</tspan><tspan x="172" dy="29.4">等待同一把锁</tspan><tspan x="172" dy="29.4">不能插入检查与提交之间</tspan><tspan x="172" dy="29.4">取得锁后仍需检查</tspan><tspan x="172" dy="29.4">实体是否正常</tspan></text>
<text x="32" y="984" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#62667f">锁保证准入互斥；实体状态决定新请求是否允许。</text>
<line x1="208" y1="228" x2="264" y2="228" stroke="#ba8850" stroke-width="2" marker-end="url(#arrow-open)" style="color: #ba8850" fill="none"/>
<line x1="440" y1="228" x2="496" y2="228" stroke="#ba8850" stroke-width="2" marker-end="url(#arrow-open)" style="color: #ba8850" fill="none"/>
<line x1="520" y1="512" x2="520" y2="568" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="520" y1="656" x2="520" y2="712" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="520" y1="800" x2="520" y2="856" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
</svg>