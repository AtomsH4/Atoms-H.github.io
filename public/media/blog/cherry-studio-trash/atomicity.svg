<svg xmlns="http://www.w3.org/2000/svg" width="752" height="1056" viewBox="0 0 752 1056" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" fill="#37335f" font-weight="700">原子性止于数据库事务边界</text>
<text x="32" y="80" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#62667f">提交之后，靠重试与对账恢复一致</text>
<rect x="240" y="152" width="400" height="88" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="440" y="196" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#37335f"><tspan x="440" dy="-16.1">命令准备</tspan><tspan x="440" dy="32.2">取得锁，检查守卫条件</tspan></text>
<rect x="240" y="312" width="400" height="128" rx="8" fill="#e7f3fa" stroke="#5495b9" stroke-width="1.5"/>
<text x="440" y="376" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#254e68"><tspan x="440" dy="-33.6">单个同步数据库事务</tspan><tspan x="440" dy="33.6">实体 + 选中关联对象</tspan><tspan x="440" dy="33.6">+ 调度状态</tspan></text>
<rect x="32" y="312" width="160" height="128" rx="8" fill="#fff2df" stroke="#ba8850" stroke-width="1.5"/>
<text x="112" y="376" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#785324"><tspan x="112" dy="-14.7">提交前异常</tspan><tspan x="112" dy="29.4">整组数据回滚</tspan></text>
<rect x="240" y="512" width="400" height="80" rx="40" fill="#e7f3fa" stroke="#5495b9" stroke-width="3"/>
<text x="440" y="552" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#254e68">COMMIT · 业务状态生效</text>
<rect x="240" y="688" width="400" height="144" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="440" y="760" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#255c49"><tspan x="440" dy="-32.2">提交后的资源同步与清理</tspan><tspan x="440" dy="32.2">运行时 / 定时器 / 通知 / 磁盘</tspan><tspan x="440" dy="32.2">按具体命令执行</tspan></text>
<rect x="32" y="696" width="160" height="128" rx="8" fill="#fff2df" stroke="#ba8850" stroke-width="1.5"/>
<text x="112" y="760" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#785324"><tspan x="112" dy="-29.4">提交后失败</tspan><tspan x="112" dy="29.4">保留提交状态</tspan><tspan x="112" dy="29.4">重试 / 对账</tspan></text>
<text x="32" y="904" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#62667f"><tspan x="32" dy="0">图示为抽象阶段，各命令的事务与后续工作不同。</tspan><tspan x="32" dy="29.4">提交前错误 → 回滚；提交后错误 ≠ 数据未改变。</tspan></text>
<line x1="440" y1="240" x2="440" y2="312" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="440" y1="440" x2="440" y2="512" stroke="#5495b9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #5495b9" fill="none"/>
<line x1="240" y1="376" x2="192" y2="376" stroke="#ba8850" stroke-width="2" marker-end="url(#arrow-open)" style="color: #ba8850" fill="none"/>
<line x1="440" y1="592" x2="440" y2="688" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="240" y1="760" x2="192" y2="760" stroke="#ba8850" stroke-width="2" marker-end="url(#arrow-open)" style="color: #ba8850" fill="none"/>
</svg>