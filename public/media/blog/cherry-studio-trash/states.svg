<svg xmlns="http://www.w3.org/2000/svg" width="752" height="984" viewBox="0 0 752 984" data-drawio="">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" fill="#37335f" font-weight="700">Topic 对话：三个状态，四条转换</text>
<rect x="224" y="144" width="320" height="128" rx="8" fill="#e4f4ed" stroke="#4b967a" stroke-width="1.5"/>
<text x="384" y="208" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#255c49"><tspan x="384" dy="-33.6">active · 正常</tspan><tspan x="384" dy="33.6">行存在</tspan><tspan x="384" dy="33.6">deletedAt = null</tspan></text>
<rect x="224" y="416" width="320" height="128" rx="8" fill="#eeeaff" stroke="#8170c9" stroke-width="1.5"/>
<text x="384" y="480" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#37335f"><tspan x="384" dy="-33.6">trashed · 已归档</tspan><tspan x="384" dy="33.6">行存在</tspan><tspan x="384" dy="33.6">deletedAt = 归档时间</tspan></text>
<rect x="224" y="688" width="320" height="104" rx="8" fill="#f0f1f5" stroke="#9096aa" stroke-width="1.5"/>
<text x="384" y="740" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#4b5166"><tspan x="384" dy="-16.8">missing · 不存在</tspan><tspan x="384" dy="33.6">数据库中没有这条记录</tspan></text>
<text x="32" y="832" text-anchor="start" dominant-baseline="hanging" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#62667f"><tspan x="32" dy="0">[空闲]：没有未完成工作；后端在锁内检查。</tspan><tspan x="32" dy="29.4">missing 不能区分「从未存在」与「已经删除」。</tspan></text>
<line x1="304" y1="272" x2="304" y2="416" stroke="#8170c9" stroke-width="2" marker-end="url(#arrow-open)" style="color: #8170c9" fill="none"/>
<line x1="464" y1="416" x2="464" y2="272" stroke="#4b967a" stroke-width="2" marker-end="url(#arrow-open)" style="color: #4b967a" fill="none"/>
<line x1="384" y1="544" x2="384" y2="688" stroke="#9096aa" stroke-width="2" marker-end="url(#arrow-open)" style="color: #9096aa" fill="none"/>
<path d="M 224 208 L 64 208 L 64 740 L 224 740" stroke="#9096aa" stroke-width="2" marker-end="url(#arrow-open)" style="color: #9096aa" fill="none"/>
<text x="212" y="344" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#37335f">归档 [空闲]</text>
<text x="528" y="344" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#255c49">恢复</text>
<text x="472" y="610" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#4b5166"><tspan x="472" dy="-14.7">回收站删除</tspan><tspan x="472" dy="29.4">或到期清理</tspan></text>
<text x="152" y="474" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#4b5166"><tspan x="152" dy="-14.7">专用永久删除</tspan><tspan x="152" dy="29.4">[空闲]</tspan></text>
</svg>